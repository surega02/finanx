    <!--
    FINANX — DIRECTION CONTRACT
    THESIS: Money is a register you stamp, not a dashboard you watch. Every transaction is one ruled row in a running ledger, and recording it is the physical press of a LUNAS stempel — the fast, calm act of marking your own truth. Refuses the dashboard-metric template and the category's white-card finance default.
    OWN-WORLD: Warm register paper (#f2f1ec) ground with hairline blue-gray ruling; ink black (#191918) for text and income figures; one saturated stamp red (#c22f1d) reserved for action, confirmation stamps, and the primary CTA. IBM Plex Mono in tabular figures carries every amount; Inter carries the UI. Nothing is enclosed in floating cards — the register is one ruled page, sections separated by rules and double rules, the balance double-underlined in ink.
    STORY: An individual signs in, sees their month as a stamped register page — income and expense as one counterforce pair, the saldo the frontmost figure — presses the red FAB to stamp a new transaction, and trusts that every row, filter, and category total is exact.
    FIRST VIEWPORT: Login as the cover of a bound register: deep ink-red cover with a cream stamped plate, the mark FINANX in stamped caps. After sign-in, the month head is a ruled plate with month navigation, income and expense columns and the double-underlined saldo; the red FAB (a hand stamp) sits at the thumb.
    FORM: The Stamped Register (direction roll seed dff48d8f; chosen via decision page, optionId assigned, code-led).
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->

    <script type="module" src="/src/main.jsx"></script>
  </body>
